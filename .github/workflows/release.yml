name: Release

# Push a tag like v0.4.0 to build binaries for Linux, macOS and Windows and
# attach them to a GitHub Release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Build-only dry run when this workflow itself changes (nothing is released).
  pull_request:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.4.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'pull_request' && 'pr-test' || github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || env.TAG }}

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="compressor-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/compressor" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "compressor-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/compressor.exe", README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            compressor-*.tar.gz*
            compressor-*.zip*

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and notes
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          rm -f *.sha256
          cat SHA256SUMS.txt
          cat > ../notes.md <<NOTES
          Compressor $TAG, prebuilt for Windows, macOS and Linux.

          - Windows: \`compressor-$TAG-x86_64-pc-windows-msvc.zip\`, unzip and run \`compressor.exe\`.
          - macOS Apple Silicon: \`compressor-$TAG-aarch64-apple-darwin.tar.gz\`
          - macOS Intel: \`compressor-$TAG-x86_64-apple-darwin.tar.gz\`
          - Linux x86_64: \`compressor-$TAG-x86_64-unknown-linux-gnu.tar.gz\`

          The binaries are unsigned. Windows SmartScreen may say "unknown publisher": click More info, then Run anyway. On macOS, right-click the binary and choose Open the first time.
          Verify downloads against SHA256SUMS.txt. See CHANGELOG.md for what changed.
          NOTES

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Compressor $TAG" --notes-file notes.md
          fi
